apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      # For local development: export DATABASE_URL in your environment or .env
      # For Kubernetes: use secretKeyRef (see dapr-components/statestore.yaml)
      value: "${DATABASE_URL}"
