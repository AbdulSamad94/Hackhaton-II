# Default values for todo-app.
# This is a YAML-formatted file.

global:
  domain: todo.local

registry: "" # Empty for local images
imagePullPolicy: Never # Never pull because we built them locally

backend:
  name: todo-backend
  image:
    repository: todo-backend
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000
  env:
    APP_NAME: "Todo Flow API"
    DEBUG: "true"
    API_PREFIX: "/api"
    JWT_EXPIRATION_DAYS: "7"
    FRONTEND_URL: "http://localhost:8080" # Local port-forward URL

frontend:
  name: todo-frontend
  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: Never
  service:
    type: LoadBalancer
    port: 3000
  env:
    NEXT_PUBLIC_API_URL: "http://localhost:8080/api" # Local port-forward URL

ingress:
  enabled: false # Disable ingress for local Minikube testing via port-forward

# SENSITIVE DATA: Placeholders for security. Populate these for deployment.
secrets:
  DATABASE_URL: "YOUR_POSTGRES_CONNECTION_STRING"
  SECRET_KEY: "YOUR_SECURE_SECRET_KEY"
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
  OPENAI_API_KEY: "YOUR_OPENAI_API_KEY"
  GITHUB_CLIENT_ID: "YOUR_GITHUB_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "YOUR_GITHUB_CLIENT_SECRET"
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
