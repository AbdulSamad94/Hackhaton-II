# Local development overrides for Minikube

registry: ""
imagePullPolicy: Never

backend:
  image:
    repository: todo-backend
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000
  env:
    APP_NAME: "Todo Flow API (Local)"
    DEBUG: "true"
    API_PREFIX: "/api"
    # For local access via port-forwarding or ingress
    FRONTEND_URL: "http://localhost:3000"

frontend:
  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: Never
  service:
    type: NodePort
    port: 3000
