apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.name }}-secrets
type: Opaque
data:
  # Values must be base64 encoded when creating Secret manifests manually, 
  # but Helm's b64enc function can do this for us.
  # These are placeholders that will pull from values.yaml or --set flags.
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc | quote }}
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | b64enc | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | b64enc | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.GITHUB_CLIENT_ID | b64enc | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.GITHUB_CLIENT_SECRET | b64enc | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.GOOGLE_CLIENT_ID | b64enc | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.GOOGLE_CLIENT_SECRET | b64enc | quote }}
